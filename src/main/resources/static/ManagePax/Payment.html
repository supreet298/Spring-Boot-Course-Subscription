<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Form</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    /* Toast styling */
    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1050;
      display: none;
      min-width: 250px;
      background-color: #28a745;
      color: white;
      padding: 10px;
      border-radius: 5px;
    }
    .toast.show {
      display: block;
      animation: fadeIn 1s;
    }
    .toast.hide {
      display: none;
    }
    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

<div class="container mt-5">
  <h2>Payment</h2>
  <form id="paymentInfoForm" class="mt-3">
  <button type="submit" name="back" onclick="goToBack()" class="btn btn-primary ml-1" style="margin-bottom:10px;"> Back </button>
    <div class="col-md-6 form-group">
      <label for="planName">Plan Name</label>    
      <input type="text" id="planName" class="form-control" disabled><!-- to display name of the plan-->
    </div>
    <div class="col-md-6 form-group">
      <label for="subscriptionType">Subscription Type</label>
      <input type="text" id="subscriptionType" class="form-control" disabled><!-- to display type of the plan-->
    </div>
    <div class="col-md-6 form-group">
      <label for="cost">Cost(₹)</label>
      <input type="text" id="cost" class="form-control" disabled><!-- to display cost of the plan-->
    </div>

    <div class="form-group">
      <label for="currency">Select Currency:<span class="text-danger">*</span></label>
      <select id="currency" name="currency">
        <option value="USD">$ - US Dollar</option>
        <option value="EUR">€ - Euro</option>
        <option value="GBP">£ - British Pound</option>
        <option value="JPY">¥ - Japanese Yen</option>
        <option value="CHF">Fr - Swiss Franc</option>
        <option value="CAD">C$ - Canadian Dollar</option>
        <option value="AUD">A$ - Australian Dollar</option>
        <option value="CNY">¥ - Chinese Yuan</option>
        <option value="INR">₹ - Indian Rupee</option>
        <option value="KRW">₩ - South Korean Won</option>
      </select>
    </div>

    <div class="form-group">
      <label for="paymentMethod">Select Payment Method:<span class="text-danger">*</span></label>
      <select id="paymentMethod" name="paymentMethod">
        <option value="CARD">CARD</option>
        <option value="ACSS_DEBIT">ACSS_DEBIT</option>
        <option value="AMAZON_PAY">AMAZON_PAY</option>
        <option value="P24">P24</option>
        <option value="SAMSUNG_PAY">SAMSUNG_PAY</option>
      </select>
    </div>

    <div class="form-group">
      <label for="paymentMode">Select Payment Mode:<span class="text-danger">*</span></label>
      <select id="paymentMode" name="paymentMode">
        <option value="PAYMENT">PAYMENT</option>
        <option value="SUBSCRIPTION">SUBSCRIPTION</option>
        <option value="SETUP">SETUP</option>
      </select>
    </div>

    <button type="submit" class="btn btn-success">Proceed</button>
    <!-- <button type="button" class="btn btn-success btn-sm" id="payBtn">Pay</button>-->
    <div id="toast" class="toast">Updated successfully!</div>
  </form>
</div>

<!-- JavaScript -->
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const uuid = urlParams.get('uuid');
  let subscription = null; // Declare variable to store subscription data

  // Fetch existing subscription details
  fetch(`/api/admin/purchaseSubscription/${uuid}`)
    .then(response => {
      if (response.status === 404) {
        alert('Subscription history not found or deleted');
        window.location.href = 'subscription.html'; // Redirect to the subscription list
        return;
      }
      return response.json();
    })
    .then(data => {
      subscription = data; // Assign subscription data to the variable
      document.getElementById('planName').value = subscription.planName;
      document.getElementById('cost').value = subscription.cost;
      document.getElementById('subscriptionType').value = subscription.subscriptionType;
    })
    .catch(error => console.error('Error fetching subscription:', error));

  // Toast message function (for success)
  function showToast(message) {
    const toastContainer = document.createElement("div");
    toastContainer.className = "toast show";
    toastContainer.textContent = message;

    document.body.appendChild(toastContainer);

    // Auto-remove toast after 3 seconds
    setTimeout(() => {
      toastContainer.remove();
    }, 3000);
  }

  document.getElementById('paymentInfoForm').addEventListener('submit', async function(event) {
    event.preventDefault();

    if (!subscription) {
      alert('Subscription data is not available.');
      return;
    }

    // Collect payment information
    const paymentInfo = {
      subscriptionUuid: subscription.subscriptionUuid, // Use subscription data
      currency: document.getElementById('currency').value,
      paymentMethodType: document.getElementById('paymentMethod').value,
      sessionMode: document.getElementById('paymentMode').value
    };

    console.log(paymentInfo);

    try {
      const response = await fetch(`/api/admin/purchaseSubscription/${uuid}/pay`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(paymentInfo)
      });

      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(errorText);
      }

      const data = await response.json();
      console.log('Server response:', data);

      if (data.checkOutUrl) {
        // Redirect to the Stripe-hosted payment page
        window.location.href = data.checkOutUrl;
      } else {
        showToast("Payment details updated successfully!");
        document.getElementById("payBtn").disabled = true; // Disable pay button after success
        setTimeout(() => {
          window.location.href = 'response.html'; // Redirect after payment
        }, 2000);
      }
    } catch (error) {
      console.error('Error:', error);
      showToast("Error occurred: " + error.message);
    }
  });
  function goToBack() {
        // Change "page2.html" to your target page's URL
        const targetPage = "info.html";
        const tabId = "subscription-tab"; // Use the relevant tab ID
        window.location.href = `${targetPage}#${tabId}`;
    }
</script>

</body>
</html>
